[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recovery-reliability-benchmark"
version = "0.1.0"
description = "A public benchmark testing whether recovery kinetics after a standardized conditioning load are reliable enough to serve as a functional endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DOCS"]
authors = [
    { name = "Ryan J. McCall" },
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "pydantic>=2.0"]

[project.scripts]
rrb-check = "recovery_reliability_benchmark.contract:main"
rrb-evaluate = "recovery_reliability_benchmark.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_reliability_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

