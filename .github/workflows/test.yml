name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: rrb-check examples/units.csv examples/responses.csv --measures tau,amplitude --post-stim-window-s 2.0
      - run: rrb-check examples/units.csv examples/responses.csv --measures tau,amplitude --post-stim-window-s 2.0 --json > report.json
      - run: python -c "import json; r=json.load(open('report.json')); assert r['status']=='fully_conforming', r['status']"
      - run: rrb-evaluate examples/units.csv examples/responses.csv --measures tau,amplitude --post-stim-window-s 2.0 --n-perm 100 --json > evaluate.json
      - run: python -c "import json; r=json.load(open('evaluate.json')); assert r['status']=='ok', r['status']"
